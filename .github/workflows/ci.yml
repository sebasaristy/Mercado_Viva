name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar
        run: npm install --no-audit --no-fund

      - name: Lint
        # Aquí se cae si alguien importó un módulo por dentro
        # en vez de por su index.js (ver ARQUITECTURA.md).
        run: npm run lint

      - name: Pruebas
        run: npm test
